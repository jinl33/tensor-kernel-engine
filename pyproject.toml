[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensor-kernel-engine"
version = "0.1.0"
description = "High-performance fused GPU kernels in Triton and a low-latency C++ inference engine."
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.scripts]
tke = "main:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
