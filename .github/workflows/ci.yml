name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest
      - name: clang-format check
        run: |
          files=$(find csrc -type f \( -name '*.cpp' -o -name '*.hpp' \))
          test -z "$files" || clang-format --dry-run --Werror $files
